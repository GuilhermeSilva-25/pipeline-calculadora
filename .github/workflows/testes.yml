name: Pipeline Calculadora

on:
  push:
    branches: [main]

jobs:
  linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o flake8
        run: pip install flake8

      - name: Rodar Análise de Código
        run: flake8 .

  test_soma:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pytest
        run: pip install pytest

      - name: Executar teste de soma
        run: pytest test_soma.py

  test_subtracao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pytest
        run: pip install pytest

      - name: Executar teste de subtracao
        run: pytest test_subtracao.py

  test_multiplicacao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pytest
        run: pip install pytest

      - name: Executar teste de multiplicacao
        run: pytest test_multiplicacao.py

  test_divisao:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pytest
        run: pip install pytest

      - name: Executar teste de divisao
        run: pytest test_divisao.py

  cobertura:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar o pytest e pytest-cov
        run: pip install pytest pytest-cov

      - name: Rodar testes com análise de cobertura
        run: pytest --cov=calculadora --cov-fail-under=100

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Verificar vazamento de Chaves de API
        run: |
          echo "Iniciando varredura de segurança..."
          if grep -r -E "ghp_[a-zA-Z0-9]{36}|AKIA[0-9A-Z]{16}|API_KEY" --exclude-dir=.git .; then
            echo "❌ ERRO DE SEGURANÇA: Chave de API, Token ou Segredo detectado no código-fonte!"
            exit 1
          else
            echo "✅ Nenhum segredo encontrado."
          fi
